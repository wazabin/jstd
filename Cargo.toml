[workspace]
members = ["derive"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wazabin/jstd"
homepage = "https://github.com/wazabin/jstd"

[workspace.dependencies]
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
criterion = "0.5"

[package]
name = "wazabin-jstd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed identifiers, registries, graph containers with dominator/SESE analysis, string interning, and stable arenas"
keywords = ["arena", "graph", "identifier", "interning", "registry"]
categories = ["data-structures", "algorithms", "rust-patterns"]
readme = "README.md"

[lib]
name = "jstd"

[dependencies]
# Fast non-cryptographic hasher for internal int-keyed maps; deterministic
# iteration order (std RandomState reseeds per process).
rustc-hash.workspace = true
jstd_derive = { package = "wazabin-jstd-derive", version = "0.2.0", path = "derive" }
serde.workspace = true

[dev-dependencies]
bincode.workspace = true
criterion.workspace = true
proptest = "1"

[[bench]]
name = "stable_arena"
harness = false

